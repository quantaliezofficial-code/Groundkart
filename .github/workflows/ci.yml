name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groundbooking
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: groundbooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundbooking -d groundbooking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://groundbooking:devpassword@localhost:5432/groundbooking_test
      TESTING: "1"
      SECRET_KEY: testsecretkeyformacsignaturesdontuseinprod12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.lock.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run test suite
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
