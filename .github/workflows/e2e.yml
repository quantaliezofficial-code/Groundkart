name: E2E Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: 'regression'
        type: choice
        options:
          - smoke
          - regression

jobs:
  e2e:
    name: Playwright E2E Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: groundbooking
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: groundbooking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U groundbooking -d groundbooking_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://groundbooking:devpassword@localhost:5432/groundbooking_test
      TESTING: "1"
      SECRET_KEY: testsecretkeyformacsignaturesdontuseinprod12345
      E2E_ALLOW_DESTRUCTIVE: "1"
      E2E_BASE_URL: "http://localhost:3000"
      E2E_API_URL: "http://localhost:8000"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.lock.txt"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.lock.txt

      - name: Run database migrations
        working-directory: backend
        run: alembic upgrade head

      - name: Seed demo dataset
        working-directory: backend
        run: python scripts/seed_dataset.py --yes-this-is-dev

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Smoke Suite (PRs)
        if: github.event_name == 'pull_request' && github.event.inputs.suite != 'regression'
        working-directory: frontend
        run: npm run test:e2e:smoke

      - name: Run Full Regression Suite (Push / Schedule / Dispatch)
        if: github.event_name != 'pull_request' || github.event.inputs.suite == 'regression'
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
